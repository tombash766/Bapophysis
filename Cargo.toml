[package]
name = "bapophysis"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "wgpu"] }
wgpu = { version = "24", default-features = false, features = ["wgsl", "dx12"] }
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
pollster = "0.4"
rfd = { version = "0.15", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
